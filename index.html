:root[data-theme="dark"]{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:20px}
h1{font-size:26px;margin:0;letter-spacing:-.01em}

.kpi b{display:block;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}

.kpi.urgent b{color:var(--urgent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.toggle{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.timeline{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tl{display:grid;grid-template-columns:96px 64px 1fr;gap:12px;padding:10px 16px;border-top:1px solid var(--line);align-items:center}
.tl:first-child{border-top:0}
.tl .d{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.days{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;text-align:center;background:var(--surface-2)}
.days.u{background:var(--red-bg);color:var(--urgent)}.days.s{background:var(--yellow-bg);color:var(--soon)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card h3{font-size:15.5px;margin:0;line-height:1.35}
.meta{font-size:13px;color:var(--muted)}
.sem{display:grid;gap:6px}
.sem details{border-radius:8px;background:var(--surface-2)}
.sem summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:6px 10px;font-size:13px}
.sem summary::-webkit-details-marker{display:none}
.sem p{margin:0;padding:0 10px 8px;font-size:12.5px;color:var(--muted)}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.g{background:var(--green-bg);color:var(--green)}.y{background:var(--yellow-bg);color:var(--yellow)}.r{background:var(--red-bg);color:var(--red)}
.money{font-size:13px}
a{color:var(--accent)}
.card a.open{font-size:13px;font-weight:600;text-decoration:none;margin-top:auto}
.card a.open:hover{text-decoration:underline}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px;box-shadow:var(--shadow)}
.panel summary{cursor:pointer;padding:10px 0;font-weight:600}
.panel ul{margin:0 0 12px;padding-left:18px}.panel li{margin:4px 0;font-size:13.5px}
.empty{color:var(--muted);padding:16px}
footer{margin-top:32px;font-size:12px;color:var(--muted)}
@media (max-width:560px){.tl{grid-template-columns:1fr auto}.tl .d{grid-column:1/-1}.grid{grid-template-columns:1fr}.toggle{margin-left:0}}
</style>
</head>

const cls = s => s.includes("🟢") ? "g" : s.includes("🟡") ? "y" : "r";
const lab = s => s.includes("🟢") ? "Fattibile" : s.includes("🟡") ? "Da verificare" : "Non fattibile";
const short = {"Music Adventure":"Music Adventure","MDNT S.R.L.":"MDNT","Ground Club":"Ground Club","Nuova impresa di un collaboratore":"Nuova impresa"};
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => new Date(d + "T12:00:00").toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"});
let filtro = "tutti", nascondiRossi = false;

function okPer(b){
  if (filtro === "tutti") return true;
  const s = b.semafori[filtro]; return s && !s.semaforo.includes("🔴");
}
function render(){
  const lista = D.bandi.filter(okPer);
  document.getElementById("sub").textContent = `Ultimo controllo ${fmt(D.aggiornato)} · ${D.visti_totali} voci monitorate`;
  const e7 = D.bandi.filter(b => b.giorni !== null && b.giorni <= 7).length;
  const e30 = D.bandi.filter(b => b.giorni !== null && b.giorni <= 30).length;
  const verdi = D.bandi.filter(b => Object.values(b.semafori).some(s => s.semaforo.includes("🟢"))).length;
  document.getElementById("kpis").innerHTML =
    `<div class="kpi"><b>${D.bandi.length}</b><span>bandi rilevanti</span></div>
     <div class="kpi urgent"><b>${e7}</b><span>scadono entro 7 giorni</span></div>
     <div class="kpi"><b>${e30}</b><span>entro 30 giorni</span></div>
     <div class="kpi"><b>${verdi}</b><span>con almeno un 🟢</span></div>`;

  const tl = [];
  lista.forEach(b => (b.date.length ? b.date : []).forEach(d => {
    const g = Math.round((new Date(d+"T12:00:00") - new Date(D.aggiornato+"T12:00:00"))/864e5);
    tl.push({d, g, b});
  }));
  tl.sort((a,b) => a.d.localeCompare(b.d));
  document.getElementById("timeline").innerHTML = tl.length ? tl.map(x =>
    `<div class="tl"><span class="d">${fmt(x.d)}</span><span class="days ${x.g<=7?"u":x.g<=30?"s":""}">${x.g} gg</span>
     <span><a href="${esc(x.b.link)}" target="_blank" rel="noopener">${esc(x.b.titolo)}</a> <span class="meta">· ${esc(x.b.ente)}</span></span></div>`).join("")
    : `<div class="empty">Nessuna scadenza datata per questo filtro.</div>`;

  document.getElementById("grid").innerHTML = lista.length ? lista.map(b => {
    const sem = D.soggetti.map(n => {
      const s = b.semafori[n]; if (!s) return "";
      if (nascondiRossi && s.semaforo.includes("🔴")) return "";
      return `<details><summary><span>${esc(short[n])}</span><span class="pill ${cls(s.semaforo)}">${s.semaforo} ${lab(s.semaforo)}</span></summary><p>${esc(s.motivo)}</p></details>`;
    }).join("");
    const scad = b.giorni === null ? "Sportello aperto" : `Prossima scadenza ${fmt(b.prossima)} · <b>${b.giorni} gg</b>`;
    return `<article class="card"><h3>${esc(b.titolo)}</h3>
      <div class="meta">${esc(b.ente)}<br>${scad}</div>
      ${b.contributo ? `<div class="money">${esc(b.contributo)}</div>` : ""}
      <div class="sem">${sem}</div>
      <a class="open" href="${esc(b.link)}" target="_blank" rel="noopener">Apri il bando ↗</a></article>`;
  }).join("") : `<div class="empty">Nessun bando 🟢/🟡 per questo soggetto.</div>`;

  document.getElementById("scartati").innerHTML = D.scartati.map(t => `<li>${esc(t)}</li>`).join("") || "<li>Nessuno</li>";
  document.getElementById("risolvere").innerHTML = D.da_risolvere.map(t => `<li>${esc(t)}</li>`).join("") || "<li>Nessuno</li>";
  document.getElementById("foot").textContent = `Generata il ${D.generato} dal monitoraggio automatico. I semafori sono istruttorie preliminari: verificare sempre il bando ufficiale.`;
}
function filtri(){
  const f = document.getElementById("filters");
  const voci = [["tutti","Tutti"], ...D.soggetti.map(s => [s, short[s]])];
  f.innerHTML = voci.map(([v,t]) => `<button class="chip" data-v="${esc(v)}" aria-pressed="${v===filtro}">${esc(t)}</button>`).join("")
    + `<label class="toggle"><input type="checkbox" id="nr"> Nascondi 🔴 nelle schede</label>`;
  f.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    filtro = c.dataset.v; f.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c)); render();
  });
  const nr = document.getElementById("nr"); nr.checked = nascondiRossi;
  nr.onchange = () => { nascondiRossi = nr.checked; render(); };
}
filtri(); render();
</script>
